name: Auto Translate Blog Articles

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'

concurrency:
  group: auto-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    name: Translate Missing Articles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto Translation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/auto-translate.mjs --sync

      - name: Commit and Push Translated Articles
        run: |
          if [ -n "$(git status --porcelain content/blog)" ]; then
            echo "New translations detected! Committing changes..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/blog/
            git commit -m "chore(i18n): auto-translate missing articles [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No new translations were generated. Working directory clean."
          fi
