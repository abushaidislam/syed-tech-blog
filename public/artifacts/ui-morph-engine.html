      margin: 0;
      padding: 0;
      user-select: none;

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0D0E;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #viewport {
      width: 1440px;
      height: 1440px;
      background: #E5E3DD;
      position: relative;
      overflow: hidden;
    }
    #camera {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 720px 720px;
    }
    #stage {
      position: absolute;
      top: 720px;
      left: 720px;
      transform: translate(-50%, -50%);
    }
    #morph-container {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      background: #000000;
      color: #FFFFFF;
      overflow: hidden;
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.35),
        0 18px 36px -18px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .layer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
    }
    #cursor {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 9999;
      transform-origin: 2px 2px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));

    svg {

    }

</head>

<script>
/**
 * CLOSED-FORM SECOND-ORDER SPRING
 */
function springUnitStep(t, omega, zeta) {
  if (t <= 0) return 0;
  const wd = omega * Math.sqrt(Math.max(0.001, 1 - zeta * zeta));
  const decay = Math.exp(-zeta * omega * t);
  return 1 - decay * (Math.cos(wd * t) + (zeta * omega / wd) * Math.sin(wd * t));
}

function multiStepSpring(t, steps, omega = 24, zeta = 0.88) {
  let val = steps[0][1];
  for (let i = 1; i < steps.length; i++) {
    const tStep = steps[i][0];
    const delta = steps[i][1] - steps[i - 1][1];
    if (t > tStep) {
      val += delta * springUnitStep(t - tStep, omega, zeta);
    }
  }
  return val;
}

function hermite(t, p0, p1, m0, m1) {
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * p0 + (t3 - 2 * t2 + t) * m0 + (-2 * t3 + 3 * t2) * p1 + (t3 - t2) * m1;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// DOM References
const cameraEl = document.getElementById("camera");
const morphContainer = document.getElementById("morph-container");
const cursorEl = document.getElementById("cursor");

const layers = {
  button: document.getElementById("layer-button"),
  loader: document.getElementById("layer-loader"),
  check: document.getElementById("layer-check"),
  island: document.getElementById("layer-island"),
  player: document.getElementById("layer-player"),
  scrubber: document.getElementById("layer-scrubber"),
  volume: document.getElementById("layer-volume"),
  toggle: document.getElementById("layer-toggle"),
  tabs: document.getElementById("layer-tabs"),
  chart: document.getElementById("layer-chart"),
  cmd: document.getElementById("layer-cmd"),
  toast: document.getElementById("layer-toast"),
};

const loaderSpinner = document.getElementById("loader-spinner");
const checkPath = document.getElementById("check-path");
const ppP1 = document.getElementById("pp-p1");
const ppP2 = document.getElementById("pp-p2");
const scrubFill = document.getElementById("scrub-fill");
const scrubThumb = document.getElementById("scrub-thumb");
const volFill = document.getElementById("vol-fill");
const toggleKnob = document.getElementById("toggle-knob");
const toggleTrack = document.getElementById("toggle-track");
const tabIndicator = document.getElementById("tab-indicator");
const chartCols = document.querySelectorAll(".chart-col");
const chartTooltip = document.getElementById("chart-tooltip");
const cmdInputText = document.getElementById("cmd-input-text");
const cmdCaret = document.getElementById("cmd-caret");
const cmdList = document.getElementById("cmd-list");
const cmdRow0 = document.getElementById("cmd-row-0");
const toastText = document.getElementById("toast-text");

/**
 * CONTAINER TIMELINE STEPS
 * Chart state runs 7.0s -> 8.5s (480x280, r=20)
 */
const widthSteps = [
  [0.0, 180], [0.5, 52], [1.0, 52], [1.5, 230], [2.0, 360],
  [3.0, 360], [4.0, 280], [4.55, 335], [4.75, 280], [5.0, 84],
  [6.0, 340], [7.0, 480], [8.5, 520], [9.0, 520], [10.0, 520],
  [10.5, 310], [11.8, 310], [12.2, 180], [14.0, 180]
];

const heightSteps = [
  [0.0, 52], [0.5, 52], [1.0, 52], [1.5, 42], [2.0, 84],
  [3.0, 60], [4.0, 48], [4.55, 46], [4.75, 48], [5.0, 48],
  [6.0, 52], [7.0, 280], [8.5, 62], [9.0, 175], [10.0, 50],
  [10.5, 48], [11.8, 48], [12.2, 52], [14.0, 52]
];

const radiusSteps = [
  [0.0, 26], [0.5, 26], [1.0, 26], [1.5, 21], [2.0, 20],
  [3.0, 16], [4.0, 24], [4.55, 23], [4.75, 24], [5.0, 24],
  [6.0, 14], [7.0, 20], [8.5, 16], [9.0, 16], [10.0, 16],
  [10.5, 14], [11.8, 14], [12.2, 26], [14.0, 26]
];

const cameraZoomSteps = [
  [0.0, 1.0], [0.5, 1.35], [1.0, 1.35], [1.5, 1.15], [2.0, 1.05],
  [3.0, 1.1], [4.0, 1.12], [4.55, 1.12], [4.75, 1.12], [5.0, 1.35],
  [6.0, 1.05], [7.0, 0.95], [8.5, 0.98], [10.5, 1.12], [11.8, 1.12],
  [12.4, 1.0], [14.0, 1.0]
];

const tabLeftSteps = [[0.0, 0], [6.0, 0], [6.5, 220], [7.0, 0], [14.0, 0]];
const tabRightSteps = [[0.0, 110], [6.0, 110], [6.46, 328], [7.0, 110], [14.0, 110]];

/**
 * PURE SEEK(T)
 */
function seek(rawT) {
  const t = ((rawT % 14.0) + 14.0) % 14.0;

  // 1. Container Closed-Form Springs
  const w = multiStepSpring(t, widthSteps, 22, 0.86);
  const h = multiStepSpring(t, heightSteps, 22, 0.86);
  const r = multiStepSpring(t, radiusSteps, 20, 0.88);
  const zoom = multiStepSpring(t, cameraZoomSteps, 16, 0.90);

  morphContainer.style.width = `${w}px`;
  morphContainer.style.height = `${h}px`;
  morphContainer.style.borderRadius = `${r}px`;
  cameraEl.style.transform = `scale(${zoom})`;

  // 2. Layer Cross-fades
  const layerDefs = [
    { name: "button", start: 0.0, end: 0.5 },
    { name: "loader", start: 0.5, end: 1.0 },
    { name: "check", start: 1.0, end: 1.5 },
    { name: "island", start: 1.5, end: 2.0 },
    { name: "player", start: 2.0, end: 3.0 },
    { name: "scrubber", start: 3.0, end: 4.0 },
    { name: "volume", start: 4.0, end: 5.0 },
    { name: "toggle", start: 5.0, end: 6.0 },
    { name: "tabs", start: 6.0, end: 7.0 },
    { name: "chart", start: 7.0, end: 8.5 },
    { name: "cmd", start: 8.5, end: 10.5 },
    { name: "toast", start: 10.5, end: 12.0 },
    { name: "button", start: 12.0, end: 14.0 }
  ];

  for (const key in layers) {
    layers[key].style.opacity = 0;
    layers[key].style.filter = "blur(5px)";
  }

  for (const def of layerDefs) {
    if (t >= def.start && t < def.end) {
      const localT = t - def.start;
      const dur = def.end - def.start;
      const enterDur = 0.12;
      const exitDur = 0.12;

      let op = 1;
      let blur = 0;
      if (localT < enterDur) {
        const p = localT / enterDur;
        op = p;
        blur = (1 - p) * 5;
      } else if (localT > dur - exitDur) {
        const p = (dur - localT) / exitDur;
        op = p;
        blur = (1 - p) * 5;
      }
      layers[def.name].style.opacity = op;
      layers[def.name].style.filter = blur > 0.05 ? `blur(${blur}px)` : "none";
    }
  }

  // 3. Precision Animations

  // Loader
  if (t >= 0.5 && t < 1.0) {
    const rot = ((t - 0.5) / 0.5) * 720;
    loaderSpinner.setAttribute("transform", `rotate(${rot} 12 12)`);
  }

  // Checkmark
  if (t >= 1.0 && t < 1.5) {
    const p = Math.min(1, Math.max(0, (t - 1.0) / 0.22));
    checkPath.style.strokeDasharray = "30";
    checkPath.style.strokeDashoffset = `${30 * (1 - p)}`;
  } else {
    checkPath.style.strokeDasharray = "none";
  }

  // Play <-> Pause morph
  if (t >= 2.0 && t < 3.0) {
    const morphP = Math.min(1, Math.max(0, (t - 2.5) / 0.16));
    const p1_x2 = lerp(11, 10, morphP);
    const p1_y2 = lerp(7, 4, morphP);
    const p1_y3 = lerp(17, 20, morphP);
    ppP1.setAttribute("d", `M6 4 L${p1_x2} ${p1_y2} L${p1_x2} ${p1_y3} L6 20 Z`);

    const p2_x1 = lerp(11, 14, morphP);
    const p2_y1 = lerp(7, 4, morphP);
    const p2_y4 = lerp(17, 20, morphP);
    const p2_x2 = lerp(19, 18, morphP);
    const p2_y2 = lerp(12, 4, morphP);
    const p2_x3 = lerp(19, 18, morphP);
    const p2_y3 = lerp(12, 20, morphP);
    ppP2.setAttribute("d", `M${p2_x1} ${p2_y1} L${p2_x2} ${p2_y2} L${p2_x3} ${p2_y3} L${p2_x1} ${p2_y4} Z`);
  }

  // Scrubber drag
  if (t >= 3.0 && t < 4.0) {
    let scrubP = 0.35;
    if (t >= 3.1 && t <= 3.65) {
      scrubP = 0.35 + ((t - 3.1) / 0.55) * 0.45;
    } else if (t > 3.65) {
      scrubP = 0.80;
    }
    scrubFill.style.width = `${scrubP * 100}%`;
    scrubThumb.style.left = `${scrubP * 100}%`;
  }

  // Volume slider drag
  if (t >= 4.0 && t < 5.0) {
    let vol = 0.65;
    if (t >= 4.1 && t < 4.55) {
      vol = 0.65 + ((t - 4.1) / 0.45) * 0.35;
    } else if (t >= 4.55) {
      vol = 1.0;
    }
    volFill.style.width = `${vol * 100}%`;
  }

  // Toggle switch
  if (t >= 5.0 && t < 6.0) {
    const isFlipped = t >= 5.3;
    const knobL = multiStepSpring(t, [[5.0, 4], [5.3, 38], [6.0, 38]], 28, 0.82);
    const knobR = multiStepSpring(t, [[5.0, 42], [5.24, 76], [5.38, 76], [6.0, 76]], 22, 0.85);
    toggleKnob.style.left = `${knobL}px`;
    toggleKnob.style.width = `${Math.max(38, knobR - knobL)}px`;
    toggleTrack.style.background = isFlipped ? "#FFFFFF" : "#1E1E1E";
    toggleKnob.style.background = isFlipped ? "#000000" : "#FFFFFF";
  }

  // Liquid tabs
  if (t >= 6.0 && t < 7.0) {
    const leftVal = multiStepSpring(t, tabLeftSteps, 24, 0.85);
    const rightVal = multiStepSpring(t, tabRightSteps, 30, 0.80);
    tabIndicator.style.left = `${leftVal}px`;
    tabIndicator.style.width = `${Math.max(105, rightVal - leftVal)}px`;
  }

  // 10. REFINED PRO CHART DYNAMICS (Spring rise + Hover Tooltip)
  if (t >= 7.0 && t < 8.5) {
    const barProgress = Math.min(1, Math.max(0, (t - 7.15) / 0.42));
    const heights = [45, 68, 96, 58, 80];
    chartCols.forEach((col, i) => {
      // Clean spring physics scaling
      col.style.height = `${heights[i] * barProgress}%`;
    });
    
    // Smooth Tooltip Appearance
    if (t >= 7.75 && t < 8.5) {
      const tipOp = Math.min(1, (t - 7.75) / 0.14);
      chartTooltip.style.opacity = tipOp;
      chartTooltip.style.transform = `translateX(-50%) translateY(${(1 - tipOp) * 4}px)`;
    } else {
      chartTooltip.style.opacity = 0;
    }
  }

  // Command palette
  if (t >= 8.5 && t < 10.5) {
    const typeStart = 8.8;
    const fullText = "deploy production";
    if (t >= typeStart) {
      const chars = Math.min(fullText.length, Math.floor((t - typeStart) * 32));
      cmdInputText.textContent = fullText.slice(0, chars);
    } else {
      cmdInputText.textContent = "";
    }
    cmdCaret.style.opacity = Math.sin(t * 12) > 0 ? 1 : 0;
    cmdList.style.opacity = t >= 9.2 ? Math.min(1, (t - 9.2) / 0.15) : 0;
    cmdRow0.style.background = t >= 9.6 ? "#242424" : "transparent";
  }

  // Toast Text Protection
  if (t >= 10.5 && t < 12.0) {
    if (t >= 11.7) {
      toastText.style.opacity = Math.max(0, 1 - (t - 11.7) / 0.2);
    } else {
      toastText.style.opacity = 1;
    }
  }

  // 4. Cursor Trajectory
  const cursorWaypoints = [
    { t: 0.0,  x: 720, y: 720, click: 0 },
    { t: 0.15, x: 720, y: 720, click: 1 },
    { t: 0.4,  x: 740, y: 750, click: 0 },
    { t: 1.5,  x: 720, y: 690, click: 0 },
    { t: 2.3,  x: 865, y: 720, click: 0 },
    { t: 2.5,  x: 865, y: 720, click: 1 },
    { t: 3.0,  x: 680, y: 720, click: 0 },
    { t: 3.1,  x: 680, y: 720, click: 1 },
    { t: 3.65, x: 810, y: 720, click: 1 },
    { t: 3.75, x: 810, y: 720, click: 0 },
    { t: 4.1,  x: 775, y: 720, click: 1 },
    { t: 4.55, x: 860, y: 720, click: 1 },
    { t: 4.7,  x: 860, y: 720, click: 0 },
    { t: 5.2,  x: 720, y: 720, click: 1 },
    { t: 5.5,  x: 720, y: 720, click: 0 },
    { t: 6.3,  x: 825, y: 720, click: 0 },
    { t: 6.5,  x: 825, y: 720, click: 1 },
    { t: 6.7,  x: 825, y: 720, click: 0 },
    { t: 7.75, x: 720, y: 640, click: 0 }, // Perfectly hovers Bar 3 inspection
    { t: 8.8,  x: 880, y: 820, click: 0 },
    { t: 9.8,  x: 720, y: 740, click: 1 },
    { t: 10.1, x: 720, y: 740, click: 0 },
    { t: 11.2, x: 720, y: 760, click: 0 },
    { t: 12.5, x: 720, y: 720, click: 0 },
    { t: 14.0, x: 720, y: 720, click: 0 }
  ];

  let curX = 720, curY = 720, isClick = 0;
  for (let i = 0; i < cursorWaypoints.length - 1; i++) {
    const wp0 = cursorWaypoints[i];
    const wp1 = cursorWaypoints[i + 1];
    if (t >= wp0.t && t <= wp1.t) {
      const u = (t - wp0.t) / (wp1.t - wp0.t);
      curX = hermite(u, wp0.x, wp1.x, 0, 0);
      curY = hermite(u, wp0.y, wp1.y, 0, 0);
      isClick = u > 0.08 && u < 0.92 ? wp1.click : wp0.click;
      break;
    }
  }

  const curScale = isClick ? 0.82 : 1.0;
  cursorEl.style.transform = `translate(${curX}px, ${curY}px) scale(${curScale})`;
// Global Playwright hook
window.seek = seek;

// Preview runner
let startTime = null;
function frame(time) {
  if (!startTime) startTime = time;
  const elapsedSec = (time - startTime) / 1000;
  seek(elapsedSec);
  requestAnimationFrame(frame);
}

// Auto-scale viewport to fit container/iframe responsively
function fitViewport() {
  const vp = document.getElementById("viewport");
  if (!vp) return;
  const scale = Math.min(window.innerWidth / 1440, window.innerHeight / 1440);
  vp.style.transform = `scale(${scale})`;
  vp.style.transformOrigin = "center center";
}
window.addEventListener("resize", fitViewport);
fitViewport();

requestAnimationFrame(frame);
</script>
