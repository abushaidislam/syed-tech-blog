<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#04070c"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="ambient-violet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-cyan" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Drop Shadow -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-violet)"/>
  <rect width="1200" height="630" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top Decorative Border -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#violet-glow)"/>

  <!-- Left Editorial Badge -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="186" height="30" rx="15" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="15" r="4.5" fill="#a78bfa"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">OCTOVERSE 2026</text>
  </g>

  <!-- Metric Pill 1: 40% Agent PRs -->
  <g transform="translate(280, 75)">
    <rect x="0" y="0" width="210" height="30" rx="15" fill="#082f49" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="15" cy="15" r="4.5" fill="#38bdf8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1">40%+ AGENT-INITIATED PRS</text>
  </g>

  <!-- Metric Pill 2: 8x Commit Volume -->
  <g transform="translate(504, 75)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#064e3b" stroke="#059669" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="15" cy="15" r="4.5" fill="#34d399"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" letter-spacing="1">8X COMMIT ACCELERATION</text>
  </g>

  <!-- Editorial Main Titles -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1.2">
      The Agentic Pull Request
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" letter-spacing="-0.5">
      From Monolithic Code Autocomplete to Runtime Multi-Model Orchestration
    </text>
  </g>

  <!-- Architecture Flow Visual (Right/Center Grid) -->
  <g transform="translate(80, 260)">
    <!-- Stage 1 Card: Intent & Orchestration -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="320" height="260" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="10" height="10" rx="5" fill="#818cf8"/>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Phase 1: Intent & Routing</text>

      <line x1="20" y1="50" x2="300" y2="50" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Node A: Task Context -->
      <rect x="20" y="65" width="280" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="32" y="86" font-family="monospace" font-size="11" fill="#a5b4fc">TASK SPECIFICATION</text>
      <text x="32" y="99" font-family="monospace" font-size="10" fill="#64748b">Repo AST • mcp.json • Issue #482</text>

      <!-- Node B: Copilot Fusion Semantic Gate -->
      <rect x="20" y="120" width="280" height="70" rx="6" fill="#18181b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="32" y="142" font-family="monospace" font-size="11" font-weight="700" fill="#c7d2fe">RUNTIME ORCHESTRATOR</text>
      <text x="32" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Policy Gate: Cascade vs. Critique</text>
      <text x="32" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Budget / Latency Bound Accounting</text>

      <!-- Step Tag -->
      <text x="20" y="235" font-family="monospace" font-size="11" fill="#6366f1">INPUT: Intent & AST Context</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 325 130 L 355 130" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="358,130 350,125 350,135" fill="#6366f1"/>

    <!-- Stage 2 Card: Solver & Cascade Engine -->
    <g transform="translate(365, 0)" filter="url(#card-shadow)">
      <rect width="320" height="260" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="10" height="10" rx="5" fill="#38bdf8"/>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Phase 2: Solver Execution</text>

      <line x1="20" y1="50" x2="300" y2="50" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Node A: Drafting Model -->
      <rect x="20" y="65" width="280" height="42" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="32" y="86" font-family="monospace" font-size="11" fill="#7dd3fc">LEG 1: RAPID SYNTHESIS</text>
      <text x="32" y="99" font-family="monospace" font-size="10" fill="#64748b">GPT-6.1 Sol / Claude Sonnet 5</text>

      <!-- Node B: Escalation / Isolated Review -->
      <rect x="20" y="120" width="280" height="70" rx="6" fill="#18181b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="32" y="142" font-family="monospace" font-size="11" font-weight="700" fill="#bae6fd">ISOLATED CRITIC / ESCALATION</text>
      <text x="32" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Tool-less Cross-Model Verification</text>
      <text x="32" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Escalate to Claude Opus 5.5 / Astra</text>

      <!-- Step Tag -->
      <text x="20" y="235" font-family="monospace" font-size="11" fill="#38bdf8">TRANSACTION: Multi-File Patch</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 690 130 L 720 130" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="723,130 715,125 715,135" fill="#10b981"/>

    <!-- Stage 3 Card: Verified Merge & CI Guard -->
    <g transform="translate(730, 0)" filter="url(#card-shadow)">
      <rect width="310" height="260" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="10" height="10" rx="5" fill="#34d399"/>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Phase 3: CI & Stacked PR</text>

      <line x1="20" y1="50" x2="290" y2="50" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Node A: Static Guard & Secret Scan -->
      <rect x="20" y="65" width="270" height="42" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <text x="32" y="86" font-family="monospace" font-size="11" fill="#6ee7b7">INVARIANT VERIFICATION</text>
      <text x="32" y="99" font-family="monospace" font-size="10" fill="#64748b">TypeScript AST Check • Push Guard</text>

      <!-- Node B: Stacked PR Merged -->
      <rect x="20" y="120" width="270" height="70" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
      <text x="32" y="142" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0">ATOMIC COMMIT & MERGE</text>
      <text x="32" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• 90% 2-Week Merge Rate</text>
      <text x="32" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Stacked Review Sequencing</text>

      <!-- Step Tag -->
      <text x="20" y="235" font-family="monospace" font-size="11" fill="#10b981">RESULT: Verified Production Ship</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">SYED TECH BLOG</text>
    <circle cx="125" cy="-4" r="2.5" fill="#475569"/>
    <text x="135" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">ARCHITECTURE & SYSTEMS INSIGHTS</text>
    <text x="1040" y="0" font-family="monospace" font-size="13" fill="#64748b">1200 × 630</text>
  </g>
</svg>
