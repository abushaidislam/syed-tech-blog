<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="ambient-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-indigo" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="630" fill="url(#ambient-indigo)"/>

  <!-- Architectural Background Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>

    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Editorial Brand Badge -->
  <g transform="translate(80, 72)">
    <rect width="170" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#06b6d4"/>
    <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYED TECH BLOG</text>
  </g>

  <!-- Category & Protocol Tag -->
  <g transform="translate(265, 72)">
    <rect width="160" height="28" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
    <text x="14" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYSTEMS &amp; AI AGENTS</text>
  </g>

  <!-- Article Headline & Subtitle -->
  <text x="80" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">
    Model Context Protocol (MCP)
  </text>
  <text x="80" y="210" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.01em">
    The USB-C Architecture for Autonomous AI Agents
  </text>
  <text x="80" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="400">
    JSON-RPC 2.0 Client-Host-Server Topology, Resources, Tools &amp; Security Invariants
  </text>

  <!-- Diagram Container -->
  <g transform="translate(80, 290)">
    <!-- Container Backdrop -->
    <rect width="1040" height="270" rx="14" fill="#0b1120" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Connecting Wires between Layers -->
    <!-- Host to Client Wire -->
    <path d="M 230 135 L 340 135" stroke="url(#wire-grad)" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- Client to Protocol Bus -->
    <path d="M 540 135 L 630 135" stroke="url(#wire-grad)" stroke-width="3"/>
    <!-- Protocol Bus to Server 1 -->
    <path d="M 770 135 C 810 135, 810 65, 850 65" stroke="#38bdf8" stroke-width="2" fill="none" stroke-opacity="0.8"/>
    <!-- Protocol Bus to Server 2 -->
    <path d="M 770 135 L 850 135" stroke="#818cf8" stroke-width="2" fill="none" stroke-opacity="0.8"/>
    <!-- Protocol Bus to Server 3 -->
    <path d="M 770 135 C 810 135, 810 205, 850 205" stroke="#c084fc" stroke-width="2" fill="none" stroke-opacity="0.8"/>

    <!-- NODE 1: MCP Host (Application) -->
    <g transform="translate(40, 75)">
      <rect width="190" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="32" rx="10" fill="#1e293b" fill-opacity="0.7"/>
      <text x="16" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">MCP HOST</text>
      <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Claude / Cursor / IDE</text>
      <text x="16" y="78" fill="#64748b" font-family="monospace" font-size="11">Agent Runtime</text>
      <text x="16" y="96" fill="#64748b" font-family="monospace" font-size="11">LLM Inference Loop</text>
    </g>

    <!-- NODE 2: MCP Client -->
    <g transform="translate(340, 75)">
      <rect width="200" height="120" rx="10" fill="#0c192e" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="32" rx="10" fill="#0369a1" fill-opacity="0.3"/>
      <text x="16" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">MCP CLIENT</text>
      <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Protocol Dispatcher</text>
      <text x="16" y="78" fill="#94a3b8" font-family="monospace" font-size="11">1:1 Server Isolation</text>
      <text x="16" y="96" fill="#94a3b8" font-family="monospace" font-size="11">Tool Permission Gate</text>
    </g>

    <!-- PROTOCOL CORE: JSON-RPC 2.0 / Stdio & SSE Transport -->
    <g transform="translate(630, 95)">
      <rect width="140" height="80" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="70" y="28" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRANSPORT</text>
      <text x="70" y="48" fill="#ffffff" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">JSON-RPC 2.0</text>
      <text x="70" y="66" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">stdio | SSE/HTTP</text>
    </g>

    <!-- NODE 3A: MCP Server (FileSystem) -->
    <g transform="translate(850, 35)">
      <rect width="150" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">RESOURCES</text>
      <text x="14" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Local Files &amp; Git</text>
    </g>

    <!-- NODE 3B: MCP Server (Database / API) -->
    <g transform="translate(850, 105)">
      <rect width="150" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="14" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">TOOLS</text>
      <text x="14" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">PostgreSQL / Cloud</text>
    </g>

    <!-- NODE 3C: MCP Server (Custom Agentic Tooling) -->
    <g transform="translate(850, 175)">
      <rect width="150" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">PROMPTS</text>
      <text x="14" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Workflows &amp; CI/CD</text>
    </g>
  </g>

  <!-- Subtle Bottom Invariants Indicator -->
  <g transform="translate(80, 580)">
    <text x="0" y="16" fill="#475569" font-family="monospace" font-size="12">
      CAPABILITIES: [Resources: file://] [Tools: execute()] [Prompts: slash-commands]
    </text>
    <text x="1040" y="16" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">
      SPECIFICATION: 2024-11-05 / DRAFT
    </text>
  </g>
</svg>
