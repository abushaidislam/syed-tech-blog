        <rect width="455" height="54" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">MATH-500 Accuracy</text>
        <text x="14" y="40" fill="#64748b" font-family="monospace" font-size="11">Base: 7.9% ───► Zero-Gradient Edit: 48.1%</text>

        <rect x="300" y="14" width="140" height="26" rx="4" fill="#1e293b"/>
        <rect x="300" y="14" width="112" height="26" rx="4" fill="#059669"/>
        <text x="360" y="31" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">+6.1x</text>
      </g>

      <!-- Comparative Stat 2: Token Limit / Thinking Loop Elimination -->
      <g transform="translate(0, 114)">
        <rect width="455" height="54" rx="8" fill="#151726" stroke="#4338ca" stroke-width="1"/>
        <text x="14" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Looping Failure (Hit 32k Limit)</text>
        <text x="14" y="40" fill="#818cf8" font-family="monospace" font-size="11">Base: 93.0% ───► Astra Edited: 33.1%</text>

        <rect x="300" y="14" width="140" height="26" rx="4" fill="#1e293b"/>
        <rect x="300" y="14" width="48" height="26" rx="4" fill="#4f46e5"/>
        <text x="360" y="31" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">-64.4%</text>
      </g>

