          <rect x="26" y="78" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.5"/>
          <rect x="52" y="78" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.7"/>
          <rect x="78" y="78" width="22" height="22" rx="3" fill="#065f46" fill-opacity="0.8"/>
          <rect x="104" y="78" width="22" height="22" rx="3" fill="#10b981" fill-opacity="0.95"/>
          <rect x="130" y="78" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.6"/>

          <!-- Row 5 -->
          <rect x="0" y="104" width="22" height="22" rx="3" fill="#065f46" fill-opacity="0.7"/>
          <rect x="26" y="104" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.8"/>
          <rect x="52" y="104" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.6"/>
          <rect x="78" y="104" width="22" height="22" rx="3" fill="#059669" fill-opacity="0.8"/>
          <rect x="104" y="104" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.7"/>
          <rect x="130" y="104" width="22" height="22" rx="3" fill="#10b981" fill-opacity="1.0"/>
