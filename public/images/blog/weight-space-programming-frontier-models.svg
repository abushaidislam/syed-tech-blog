          <text x="0" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Matrix Product Analysis: W_Q · W_K^T</text>

          <rect x="0" y="52" width="230" height="28" rx="4" fill="#1e293b"/>
          <text x="10" y="70" fill="#a7f3d0" font-family="monospace" font-size="11">Heads: [2.1, 3.1, 3.5] Match</text>

          <text x="0" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Identified Python vs. Romaji vs. English</text>
          <text x="0" y="122" fill="#64748b" font-family="monospace" font-size="10">Without input/output embeddings</text>
        </g>
      </g>
    </g>

    <!-- Center Divider -->
    <line x1="520" y1="20" x2="520" y2="265" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Right Subpanel: Targeted Weight Surgery (Qwen3.5-0.8B) -->
    <g transform="translate(550, 25)">
      <text x="0" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">SURGICAL INTERVENTION: QWEN3.5-0.8B</text>
