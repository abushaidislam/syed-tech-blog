  <!-- Editorial Brand Badge -->
  <g transform="translate(80, 68)">
    <rect width="170" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10b981"/>
    <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYED TECH BLOG</text>
  </g>

  <!-- Category & Research Tag -->
  <g transform="translate(265, 68)">
    <rect width="245" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
    <text x="14" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RESEARCH &amp; DEEP LEARNING</text>
  </g>

  <!-- Article Headline & Subtitle -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-0.025em">
    Weight-Space Programming
  </text>
  <text x="80" y="196" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing="-0.01em">
    Direct Neural Tensor Surgery Without Gradient Descent
  </text>
  <text x="80" y="234" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400">
    How frontier LLMs read raw float matrices, craft zero-shot policies, and surgically resolve model loops
  </text>

