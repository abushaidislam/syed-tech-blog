          <rect x="26" y="26" width="22" height="22" rx="3" fill="#10b981" fill-opacity="1.0" stroke="#a7f3d0" stroke-width="1.5"/>
          <rect x="52" y="26" width="22" height="22" rx="3" fill="#065f46" fill-opacity="0.8"/>
          <rect x="78" y="26" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.5"/>
          <rect x="104" y="26" width="22" height="22" rx="3" fill="#059669" fill-opacity="0.7"/>
          <rect x="130" y="26" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.6"/>

          <!-- Row 3 -->
          <rect x="0" y="52" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.6"/>
          <rect x="26" y="52" width="22" height="22" rx="3" fill="#065f46" fill-opacity="0.8"/>
          <rect x="52" y="52" width="22" height="22" rx="3" fill="#10b981" fill-opacity="0.9"/>
          <rect x="78" y="52" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.8"/>
          <rect x="104" y="52" width="22" height="22" rx="3" fill="#064e3b" fill-opacity="0.5"/>
          <rect x="130" y="52" width="22" height="22" rx="3" fill="#059669" fill-opacity="0.7"/>

