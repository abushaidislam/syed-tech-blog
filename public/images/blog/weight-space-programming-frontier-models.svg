      <text x="0" y="34" fill="#64748b" font-family="monospace" font-size="11">Direct float interpretation without forward passes</text>

      <!-- Heatmap / Tensor Representation -->
      <g transform="translate(0, 52)">
        <rect width="440" height="180" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>

        <!-- Tensor Grid representation -->
        <g transform="translate(18, 18)">
          <!-- Matrix Rows -->
          <!-- Row 1 -->
          <rect x="0" y="0" width="22" height="22" rx="3" fill="#065f46" fill-opacity="0.8"/>
          <rect x="26" y="0" width="22" height="22" rx="3" fill="#047857" fill-opacity="0.9"/>
          <rect x="52" y="0" width="22" height="22" rx="3" fill="#059669" fill-opacity="0.7"/>
          <rect x="78" y="0" width="22" height="22" rx="3" fill="#10b981" fill-opacity="0.95"/>
