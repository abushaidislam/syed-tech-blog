<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="45%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="ambient-indigo" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-emerald" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c28" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d121c" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="630" fill="url(#ambient-indigo)"/>
  <rect width="1200" height="630" fill="url(#ambient-emerald)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>

  <!-- Left Editorial Section -->
  <!-- Category Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="190" height="34" rx="17" fill="#6366f1" fill-opacity="0.12" stroke="#818cf8" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#a5b4fc"/>
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SYSTEMS &amp; AGENTS</text>
  </g>

  <!-- Editorial Main Title -->
  <text x="80" y="160" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
    Scaling 1,000-Agent Swarms
  </text>
  <text x="80" y="215" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
    Behind Claude Fable 5.2
  </text>

  <!-- Subtitle -->
  <text x="80" y="270" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="-0.2">
    Postgres-driven coordination, recursive DAG partitioning, and
  </text>
  <text x="80" y="298" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="-0.2">
    formal mathematical verification in unconstrained agent swarms.
  </text>

  <!-- Metric Badges Group -->
  <g transform="translate(80, 360)">
    <!-- Metric 1: 1,000 Sandboxes -->
    <rect width="155" height="74" rx="12" fill="#131926" stroke="#2a354c" stroke-width="1"/>
    <text x="18" y="32" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">1,000</text>
    <text x="18" y="55" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ISOLATED VM NODES</text>

    <!-- Metric 2: 28.7 Hours -->
    <rect x="170" width="155" height="74" rx="12" fill="#131926" stroke="#2a354c" stroke-width="1"/>
    <text x="188" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">28.7h</text>
    <text x="188" y="55" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">FORMAL PROOF RUN</text>

    <!-- Metric 3: 2,418 Tasks -->
    <rect x="340" width="155" height="74" rx="12" fill="#131926" stroke="#2a354c" stroke-width="1"/>
    <text x="358" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">2,418</text>
    <text x="358" y="55" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">RECURSIVE SUBTASKS</text>
  </g>

  <!-- Author Identity Tag -->
  <g transform="translate(80, 520)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SF</text>
    <text x="48" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Syed Farhan</text>
    <text x="48" y="33" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Chief Architecture &amp; Research · Syed Tech Blog</text>
  </g>

  <!-- Right Visual Architecture Diagram -->
  <g transform="translate(680, 85)" filter="url(#shadow)">
    <!-- Container Panel -->
    <rect width="440" height="460" rx="18" fill="url(#card-grad)" stroke="#232e42" stroke-width="1.5"/>

    <!-- Window Bar -->
    <circle cx="28" cy="26" r="5.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="48" cy="26" r="5.5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="68" cy="26" r="5.5" fill="#10b981" fill-opacity="0.8"/>
    <text x="92" y="31" fill="#475569" font-family="monospace" font-size="12" font-weight="600">swarm-orchestrator.topology.pg</text>

    <!-- Top Node: 1 Lead Agent -->
    <g transform="translate(135, 60)">
      <rect width="170" height="48" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="8" fill="#818cf8"/>
      <text x="42" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Lead Orchestrator</text>
      <text x="42" y="36" fill="#a5b4fc" font-family="monospace" font-size="10">Agent #0 (Planner)</text>
    </g>

    <!-- Connector Lines from Lead to Shared Infrastructure -->
    <line x1="220" y1="108" x2="220" y2="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Central Infrastructure: PostgreSQL Coordination Bus -->
    <g transform="translate(50, 140)">
      <rect width="340" height="96" rx="12" fill="#0b1322" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="18" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SHARED POSTGRESQL STATE LOG</text>
      <text x="18" y="44" fill="#64748b" font-family="monospace" font-size="10">36,612 Writes · 311,734 Reads · 5-sec SQL limits</text>

      <!-- Tables Pills -->
      <g transform="translate(18, 56)">
        <rect width="55" height="24" rx="5" fill="#1e293b"/>
        <text x="27" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">announce</text>

        <rect x="62" width="48" height="24" rx="5" fill="#1e293b"/>
        <text x="86" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">assign</text>

        <rect x="117" width="45" height="24" rx="5" fill="#1e293b"/>
        <text x="139" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">notes</text>

        <rect x="169" width="60" height="24" rx="5" fill="#1e293b"/>
        <text x="199" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">subtasks</text>

        <rect x="236" width="55" height="24" rx="5" fill="#1e293b"/>
        <text x="263" y="16" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9">landed</text>
      </g>
    </g>

    <!-- Connector Lines to Helper Pool -->
    <line x1="120" y1="236" x2="120" y2="265" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="220" y1="236" x2="220" y2="265" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="320" y1="236" x2="320" y2="265" stroke="#10b981" stroke-width="1.5"/>

    <!-- Helper Tier Nodes (999 Agents) -->
    <g transform="translate(40, 265)">
      <!-- Worker Crew A -->
      <rect width="110" height="64" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <text x="26" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Crew Captain</text>
      <text x="14" y="38" fill="#94a3b8" font-family="monospace" font-size="9">Task Decomposition</text>
      <text x="14" y="52" fill="#64748b" font-family="monospace" font-size="8">Agents #1..46</text>

      <!-- Worker Crew B -->
      <rect x="125" width="110" height="64" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <circle cx="141" cy="18" r="4" fill="#a855f7"/>
      <text x="151" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Lean Solvers</text>
      <text x="139" y="38" fill="#94a3b8" font-family="monospace" font-size="9">Kernel Proving</text>
      <text x="139" y="52" fill="#64748b" font-family="monospace" font-size="8">Agents #47..750</text>

      <!-- Worker Crew C -->
      <rect x="250" width="110" height="64" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <circle cx="266" cy="18" r="4" fill="#10b981"/>
      <text x="276" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Git Mergers</text>
      <text x="264" y="38" fill="#94a3b8" font-family="monospace" font-size="9">Branch Validation</text>
      <text x="264" y="52" fill="#64748b" font-family="monospace" font-size="8">Agents #751..999</text>
    </g>

    <!-- Connector Lines to Safety & Verification Layer -->
    <line x1="220" y1="329" x2="220" y2="355" stroke="#64748b" stroke-width="1.5"/>

    <!-- Bottom Layer: Verification & Safety Monitors -->
    <g transform="translate(40, 355)">
      <rect width="360" height="80" rx="10" fill="#0a191e" stroke="#059669" stroke-width="1.5"/>
      <circle cx="22" cy="24" r="6" fill="#10b981"/>
      <text x="36" y="27" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">VERIFICATION &amp; DUAL-LAYER SAFETY</text>
      <text x="20" y="48" fill="#a7f3d0" font-family="monospace" font-size="10">Lean 4 Checker: 100% Statements Formally Verified</text>
      <text x="20" y="66" fill="#6ee7b7" font-family="monospace" font-size="9">Real-time Fail-Closed Tool Classifier · Offline CoT Monitor</text>
    </g>
  </g>
</svg>
