<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="indigo-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="240" cy="200" r="380" fill="url(#glow-left)"/>
  <circle cx="960" cy="420" r="380" fill="url(#glow-right)"/>

  <!-- Header Badge -->
  <g transform="translate(100, 80)">
    <rect width="220" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#06b6d4"/>
    <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" letter-spacing="1">ARCHITECTURE GUIDE</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(100, 160)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="-0.03em">
      <tspan x="0" y="0">Decoupling Docs Architecture:</tspan>
      <tspan x="0" y="58" fill="url(#indigo-cyan)">Standalone Qodewk Engine</tspan>
    </text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#94a3b8" letter-spacing="-0.01em">
      Extracting Next.js &amp; MDX from bloated monorepos into ultra-fast documentation.
    </text>
  </g>

  <!-- Architecture Visual Diagram -->
  <g transform="translate(100, 320)">
    <!-- Monorepo Card (Left) -->
    <rect x="0" y="0" width="280" height="190" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f87171" letter-spacing="0.5">HEAVY MONOREPO</text>
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">45+ packages / lockfile bloat</text>
    <g transform="translate(24, 82)">
      <rect width="232" height="26" rx="6" fill="#1e293b"/>
      <text x="12" y="17" font-family="monospace" font-size="11" fill="#94a3b8">apps/web (Next.js)</text>
      <rect y="32" width="232" height="26" rx="6" fill="#1e293b"/>
      <text x="12" y="49" font-family="monospace" font-size="11" fill="#94a3b8">packages/ui (Design System)</text>
      <rect y="64" width="232" height="26" rx="6" fill="#1e293b"/>
      <text x="12" y="81" font-family="monospace" font-size="11" fill="#94a3b8">apps/api (Edge Services)</text>
    </g>

    <!-- Decoupling Arrow / Pipeline (Middle) -->
    <g transform="translate(320, 75)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="url(#indigo-cyan)" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="120,14 134,20 120,26" fill="#06b6d4"/>
      <rect x="22" y="4" width="80" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="62" y="24" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#a5b4fc">SPARSE</text>
    </g>

    <!-- Decoupled Engine Card (Right) -->
    <rect x="490" y="0" width="510" height="190" rx="16" fill="#0b1329" stroke="url(#card-border)" stroke-width="2"/>
    <text x="514" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="0.5">QODEWK STANDALONE ENGINE</text>
    <text x="514" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Zero monorepo runtime overhead • Instant builds</text>

    <!-- Metric Pills inside Decoupled Engine Card -->
    <g transform="translate(514, 82)">
      <rect width="145" height="78" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">BUILD TIME</text>
      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#34d399">-82%</text>

      <rect x="160" y="0" width="145" height="78" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="176" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">INSTALL SIZE</text>
      <text x="176" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">-94%</text>

      <rect x="320" y="0" width="145" height="78" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="336" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">LIGHTHOUSE</text>
      <text x="336" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#a78bfa">100/100</text>
    </g>
  </g>

  <!-- Footer Brand -->
  <g transform="translate(100, 560)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b">
      syed-tech-blog • engineering insights
    </text>
  </g>
</svg>