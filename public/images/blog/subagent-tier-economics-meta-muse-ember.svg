<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="45%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="ember-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="ambient-orange" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-indigo" cx="80%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#3730a3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0"/>
    </radialGradient>

    <!-- Panel Drop Shadow -->
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-orange)"/>
  <rect width="1200" height="630" fill="url(#ambient-indigo)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>

    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="215" x2="1200" y2="215"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="365" x2="1200" y2="365"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="515" x2="1200" y2="515"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Editorial Brand Badge -->
  <g transform="translate(80, 68)">
    <rect width="170" height="28" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#fb923c"/>
    <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYED TECH BLOG</text>
  </g>

  <!-- Architecture Domain Badge -->
  <g transform="translate(265, 68)">
    <rect width="215" height="28" rx="6" fill="#2d1506" fill-opacity="0.65" stroke="#ea580c" stroke-width="1"/>
    <text x="14" y="18" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SUBAGENT ARCHITECTURE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-0.025em">
    The Rise of Subagent Tier Economics
  </text>
  <text x="80" y="198" fill="url(#ember-flame)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.01em">
    How Meta Muse Ember Redefines High-Throughput Autonomous Coding
  </text>
  <text x="80" y="236" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400">
    Deconstructing $0.10/M Token Pricing, 1M Context Windows, and Dual-Tier Agent Topologies
  </text>

  <!-- Main Architecture Container -->
  <g transform="translate(80, 272)">
    <rect width="1040" height="285" rx="14" fill="#090d15" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" filter="url(#panel-shadow)"/>

    <!-- Wiring Flow Lines -->
    <!-- Tier 1 to Tier 2 Router -->
    <path d="M 235 90 L 310 90" stroke="#f97316" stroke-width="2.5"/>
    <!-- Router to Parallel Subagent Slots -->
    <path d="M 470 90 C 510 90, 520 48, 560 48" stroke="#fb923c" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 470 90 L 560 90" stroke="#fb923c" stroke-width="2.5"/>
    <path d="M 470 90 C 510 90, 520 132, 560 132" stroke="#fb923c" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 470 90 C 510 90, 520 174, 560 174" stroke="#fb923c" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Subagents into Verification/Result Box -->
    <path d="M 760 90 L 830 90" stroke="#10b981" stroke-width="2.5"/>

    <!-- TIER 1: Orchestrator / Planner -->
    <g transform="translate(30, 25)">
      <rect width="205" height="135" rx="10" fill="#131c2e" stroke="#3b82f6" stroke-width="1.4"/>
      <rect x="0" y="0" width="205" height="28" rx="10" fill="#1d4ed8" fill-opacity="0.3"/>
      <text x="14" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">TIER 1 · LEAD PLANNER</text>
      <text x="14" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Muse Wonder / Opus</text>
      <text x="14" y="74" fill="#94a3b8" font-family="monospace" font-size="11">• Global Spec Synthesis</text>
      <text x="14" y="94" fill="#94a3b8" font-family="monospace" font-size="11">• Task Decomposition</text>
      <text x="14" y="114" fill="#94a3b8" font-family="monospace" font-size="11">• Critical Architectural Review</text>
      <text x="14" y="134" fill="#64748b" font-family="monospace" font-size="10">High Reasoning / High Cost</text>
    </g>

    <!-- TIER 1.5: Subagent Dispatch & Caching Layer -->
    <g transform="translate(310, 40)">
      <rect width="160" height="105" rx="10" fill="#1a1410" stroke="#c2410c" stroke-width="1.4"/>
      <rect x="0" y="0" width="160" height="26" rx="10" fill="#ea580c" fill-opacity="0.25"/>
      <text x="12" y="18" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">TASK DISPATCHER</text>
      <text x="12" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Prompt Caching Hub</text>
      <text x="12" y="68" fill="#fdba74" font-family="monospace" font-size="11">$0.004 / 1M Cache</text>
      <text x="12" y="86" fill="#94a3b8" font-family="monospace" font-size="11">Tool State Marshaling</text>
    </g>

    <!-- TIER 2: Parallel Subagent Execution (Muse Ember) -->
    <g transform="translate(560, 25)">
      <rect width="200" height="175" rx="10" fill="#20120b" stroke="#f97316" stroke-width="1.8"/>
      <rect x="0" y="0" width="200" height="28" rx="10" fill="#ea580c" fill-opacity="0.4"/>
      <text x="14" y="19" fill="#ffedd5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">TIER 2 · WORKHORSE</text>
      <text x="14" y="52" fill="#fff7ed" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Muse Ember 1.0</text>
      <text x="14" y="74" fill="#fdba74" font-family="monospace" font-size="11">• $0.10 / 1M Input Tokens</text>
      <text x="14" y="94" fill="#fdba74" font-family="monospace" font-size="11">• $0.50 / 1M Output Tokens</text>
      <text x="14" y="114" fill="#fed7aa" font-family="monospace" font-size="11">• 1M Context / 512K Output</text>
      <text x="14" y="134" fill="#fed7aa" font-family="monospace" font-size="11">• Terminal Coding Loops</text>
      <text x="14" y="154" fill="#fed7aa" font-family="monospace" font-size="11">• Fast P95 Latency: 2.2s</text>
    </g>

    <!-- TIER 3: Result Aggregation & PR Validation -->
    <g transform="translate(830, 45)">
      <rect width="180" height="100" rx="10" fill="#06281e" stroke="#10b981" stroke-width="1.4"/>
      <rect x="0" y="0" width="180" height="26" rx="10" fill="#047857" fill-opacity="0.3"/>
      <text x="12" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">VERIFIED COMMIT</text>
      <text x="12" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Test &amp; Linter Green</text>
      <text x="12" y="68" fill="#a7f3d0" font-family="monospace" font-size="11">Pass@1 Mergeability</text>
      <text x="12" y="86" fill="#a7f3d0" font-family="monospace" font-size="11">Clean Git Trajectory</text>
    </g>

    <!-- METRICS CALLOUT FOOTER INSIDE PANEL -->
    <g transform="translate(30, 215)">
      <rect width="980" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        ECONOMIC DISRUPTION:
      </text>
      <text x="180" y="31" fill="#38bdf8" font-family="monospace" font-size="12">
        Task Cost: $0.14 (vs $2.39 Muse Spark / $0.41 Haiku 5.5)
      </text>
      <text x="640" y="31" fill="#4ade80" font-family="monospace" font-size="12">
        Terminal-Bench: 40.9% | Coding Index: 46
      </text>
    </g>
  </g>

  <!-- Invariants & Telemetry Footer -->
  <g transform="translate(80, 582)">
    <text x="0" y="16" fill="#475569" font-family="monospace" font-size="12">
      PARADIGM: [Dual-Tier Model Stacks] [Subagent Specialization] [Ultra-Dense Token Economics]
    </text>
    <text x="1040" y="16" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">
      EVAL: ARTIFICIAL ANALYSIS INDEX V5 · NOV 2026
    </text>
  </g>
</svg>