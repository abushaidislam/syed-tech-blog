<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="amber-coral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wire-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="ambient-blue" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-violet" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-blue)"/>
  <rect width="1200" height="630" fill="url(#ambient-violet)"/>

  <!-- Subtle Architecture Grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>

    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="215" x2="1200" y2="215"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="365" x2="1200" y2="365"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="515" x2="1200" y2="515"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Editorial Brand Badge -->
  <g transform="translate(80, 68)">
    <rect width="170" height="28" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYED TECH BLOG</text>
  </g>

  <!-- Category & Architectural Domain Badge -->
  <g transform="translate(265, 68)">
    <rect width="195" height="28" rx="6" fill="#0f2942" fill-opacity="0.6" stroke="#0284c7" stroke-width="1"/>
    <text x="14" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AGENT INFRASTRUCTURE</text>
  </g>

  <!-- Article Headline & Subtitle -->
  <text x="80" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.025em">
    The Anatomy of Autonomous Agent Runtimes
  </text>
  <text x="80" y="200" fill="url(#cyan-indigo)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="-0.01em">
    Trajectories, Inboxes, and the Fall of the Unbounded Loop
  </text>
  <text x="80" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400">
    Lessons from 100K PRs: Git-Modeled Event Streams, Lazy Context Projection, and Stateful Sandboxes
  </text>

  <!-- Main System Diagram Container -->
  <g transform="translate(80, 275)">
    <rect width="1040" height="280" rx="14" fill="#090d16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#panel-shadow)"/>

    <!-- Wiring / Connector Paths -->
    <!-- Lane 1: External actors -> Inbox -->
    <path d="M 230 70 L 300 70" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Lane 2: Inbox -> Boundary Admittance -> Trajectory -->
    <path d="M 460 70 C 510 70, 510 135, 560 135" stroke="url(#cyan-indigo)" stroke-width="2.5"/>
    <!-- Lane 3: Trajectory -> Lazy Context Projection -->
    <path d="M 770 135 L 830 135" stroke="#34d399" stroke-width="2.5"/>
    <!-- Fork Path from Trajectory -->
    <path d="M 665 175 C 665 215, 730 225, 830 225" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,4"/>

    <!-- COMPONENT 1: External Arrivals (Actors & Control Plane) -->
    <g transform="translate(35, 30)">
      <rect width="195" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="195" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
      <text x="14" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">EXTERNAL ACTORS</text>
      <text x="14" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">User / Subagents / ACP</text>
      <text x="14" y="74" fill="#64748b" font-family="monospace" font-size="11">Asynchronous Signals</text>
      <text x="14" y="92" fill="#64748b" font-family="monospace" font-size="11">Pub/Sub Activations</text>
    </g>

    <!-- COMPONENT 2: The Inbox Log (Decoupled Arrival) -->
    <g transform="translate(300, 30)">
      <rect width="160" height="100" rx="10" fill="#0b1b2b" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="160" height="28" rx="10" fill="#0369a1" fill-opacity="0.35"/>
      <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">INBOX LOG</text>
      <text x="14" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Append-Only Buffer</text>
      <text x="14" y="74" fill="#94a3b8" font-family="monospace" font-size="11">Never Contended</text>
      <text x="14" y="92" fill="#94a3b8" font-family="monospace" font-size="11">Durable Messages</text>
    </g>

    <!-- COMPONENT 3: Agent Trajectory (Git-Modeled Event Stream) -->
    <g transform="translate(560, 65)">
      <rect width="210" height="150" rx="10" fill="#131c2e" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="210" height="28" rx="10" fill="#1d4ed8" fill-opacity="0.3"/>
      <text x="14" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">AGENT TRAJECTORY</text>
      <text x="14" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Single Writer Event Log</text>
      <text x="14" y="74" fill="#94a3b8" font-family="monospace" font-size="11">• IterationEnd Boundaries</text>
      <text x="14" y="94" fill="#94a3b8" font-family="monospace" font-size="11">• Parent-Pointer DAG</text>
      <text x="14" y="114" fill="#94a3b8" font-family="monospace" font-size="11">• O(1) Zero-Copy Forks</text>
      <text x="14" y="134" fill="#94a3b8" font-family="monospace" font-size="11">• Suspend / Resume</text>
    </g>

    <!-- COMPONENT 4A: Lazy Context Projection -->
    <g transform="translate(830, 70)">
      <rect width="180" height="85" rx="8" fill="#06281e" stroke="#10b981" stroke-width="1.3"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#047857" fill-opacity="0.3"/>
      <text x="12" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">CONTEXT PROJECTION</text>
      <text x="12" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Prompt Construction</text>
      <text x="12" y="66" fill="#a7f3d0" font-family="monospace" font-size="11">Compaction + Sidechain</text>
    </g>

    <!-- COMPONENT 4B: Machine Forking & Snapshots -->
    <g transform="translate(830, 175)">
      <rect width="180" height="80" rx="8" fill="#201138" stroke="#a855f7" stroke-width="1.3"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#7e22ce" fill-opacity="0.3"/>
      <text x="12" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">STATEFUL SANDBOX</text>
      <text x="12" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Fork CPU, RAM &amp; Disk</text>
      <text x="12" y="66" fill="#d8b4fe" font-family="monospace" font-size="11">Durable Execution</text>
    </g>

    <!-- BOTTOM PILLARS INDICATOR -->
    <g transform="translate(35, 175)">
      <rect width="425" height="80" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">THE CONSTRAINED PARADIGM</text>
      <text x="16" y="48" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">1. Narrow domain scope &amp; opinionated runtime stacks</text>
      <text x="16" y="66" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">2. Match agent freedom to model capability (No rabbit holes)</text>
    </g>
  </g>

  <!-- Invariants & Footer Tags -->
  <g transform="translate(80, 580)">
    <text x="0" y="16" fill="#475569" font-family="monospace" font-size="12">
      INVARIANTS: [Exclusive Writer Trajectory] [Decoupled Inbox Buffer] [Lazy Context Derivation]
    </text>
    <text x="1040" y="16" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">
      SCALE: 500M+ EVENTS/DAY | 100K+ PRs
    </text>
  </g>
</svg>
